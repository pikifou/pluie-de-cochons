:root { color-scheme: dark; }
html, body { margin: 0; height: 100%; background: #070a24; overflow: hidden; overscroll-behavior: none; }
body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
canvas { display: block; width: 100%; height: 100%; }
#nom-boite { position: fixed; inset: 0; background: rgba(4,6,24,0.85); display: flex; align-items: center; justify-content: center; z-index: 5; }
#nom-boite[hidden] { display: none; }
#nom-form { display: flex; flex-direction: column; gap: 16px; align-items: center; padding: 28px; border: 3px solid #ff5cae; box-shadow: 0 0 24px #ff5cae; background: #0d1240; }
#nom-form label { font: 700 26px PDC, sans-serif; color: #ffb6cb; }
#nom-champ { font: 700 30px PDC, sans-serif; width: 12ch; padding: 8px 12px; background: #070a24; color: #fff; border: 2px solid #4df3ff; outline: none; text-align: center; }
#nom-champ:focus { box-shadow: 0 0 14px #4df3ff; }
#nom-ok { font: 24px PS2, monospace; padding: 14px 28px; background: #070a24; color: #6dff8f; border: 3px solid #6dff8f; cursor: pointer; }
/* l'histoire : une intro, une fin (vidéo si elle est là, puis l'image et le texte) */
#cine { --cine-fond: #070a24; --cine-texte: #fff4fa; --cine-titre: #ffe14d; --cine-bouton: #6dff8f; --cine-rose: #ff5cae;
  position: fixed; inset: 0; z-index: 6; background: var(--cine-fond); display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
#cine[hidden] { display: none; }
#cine .cadre { position: relative; height: 100%; max-width: 100%; aspect-ratio: 9 / 16; overflow: hidden; }
#cine video, #cine img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#cine img { opacity: 0; transition: opacity .6s; } #cine.texte img { opacity: 1; }
#cine .txt { position: absolute; left: 0; right: 0; bottom: 0; padding: 56px 7% max(6%, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
  background: linear-gradient(rgba(7,10,36,0), rgba(7,10,36,.82) 38%, rgba(7,10,36,.94)); opacity: 0; transform: translateY(20px); transition: opacity .6s .3s, transform .6s .3s; pointer-events: none; }
#cine.texte .txt { opacity: 1; transform: none; pointer-events: auto; }
/* l'intro : le texte en haut, sur le ciel (le héros est en bas de l'image) */
#cine.haut .txt { bottom: auto; top: 0; padding: max(6%, env(safe-area-inset-top)) 7% 70px; transform: translateY(-20px); background: linear-gradient(rgba(7,10,36,.94), rgba(7,10,36,.82) 62%, rgba(7,10,36,0)); }
#cine.haut.texte .txt { transform: none; }
#cine h2 { position: absolute; top: max(5%, env(safe-area-inset-top)); left: 0; right: 0; margin: 0; text-align: center; opacity: 0; transition: opacity .8s;
  font: clamp(30px, 6.5vh, 56px) PS2, monospace; color: var(--cine-titre); text-shadow: 0 4px 0 #1a0630, 0 0 18px rgba(255,225,77,.55); }
#cine.texte h2 { opacity: 1; } #cine h2[hidden] { display: none; }
#cine p { margin: 0; font: 700 clamp(17px, 2.6vh, 26px)/1.2 PDC, sans-serif; color: var(--cine-texte); text-shadow: 0 3px 0 #1a0630; }
#cine p.l1 { color: #ffb6cb; font-size: clamp(20px, 3.2vh, 30px); }
#cine button { font: clamp(16px, 2.6vh, 22px) PS2, monospace; cursor: pointer; white-space: nowrap; }
#cine .go { color: var(--cine-bouton); background: rgba(7,10,36,.9); border: 3px solid var(--cine-bouton); box-shadow: 0 0 18px var(--cine-bouton); padding: 14px 26px; margin-top: 6px; }
#cine .passer { position: absolute; top: max(14px, env(safe-area-inset-top)); right: 14px; font-size: 14px; padding: 9px 12px; color: #fff; background: rgba(7,10,36,.7); border: 2px solid var(--cine-rose); }
#cine.texte .passer { display: none; }
</style>
</head>

<script>// Pluie de Cochons : logique pure (coupes, rivaux, maîtrise, choix des questions).
// Pas de DOM ici : testable sous node (node --test tests/logic.test.js).

  { id: '100', nom: '100cc', granges: 5,  facteur: 1.15 },
  { id: '150', nom: '150cc', granges: 10, facteur: 1.00 },

const COUPES = [
  { id: 'paille',   nom: 'Coupe Paille',   tables: [1, 2, 10], dur: 0.85, couleur: '#ffe066' },
  { id: 'boue',     nom: 'Coupe Boue',     tables: [3, 4, 5],  dur: 1.00, couleur: '#c98a4b' },
  { id: 'gland',    nom: 'Coupe Gland',    tables: [6, 7],     dur: 1.15, couleur: '#7dff6a' },
  { id: 'tracteur', nom: 'Coupe Tracteur', tables: [8, 9],     dur: 1.20, couleur: '#ff5c8a' },
  { id: 'etoile',   nom: 'Coupe Étoile',   tables: [2, 3, 4, 5, 6, 7, 8, 9], dur: 1.30, couleur: '#4df3ff', speciale: true },
];

// ---------- Rivaux (les faux profils à battre) ----------
// base : secondes par grange en 150cc sur une coupe de difficulté 1.
// gout : petites préférences par coupe (le lapin aime les tables faciles, le hibou les dures...).
const RIVAUX = [
  { id: 'loup',     nom: 'Loulou',     base: 3.0, gout: { paille: 1.05, boue: 1.0,  gland: 0.97, tracteur: 0.97, etoile: 0.96 }, couleur: '#ff4d4d' },
  { id: 'hibou',    nom: 'Hubert',     base: 3.6, gout: { paille: 1.15, boue: 1.05, gland: 0.95, tracteur: 0.9,  etoile: 0.92 }, couleur: '#c9945a' },
  { id: 'renard',   nom: 'Rapido',     base: 4.3, gout: { paille: 0.9,  boue: 0.95, gland: 1.05, tracteur: 1.05, etoile: 1.0 },  couleur: '#ff9a3c' },
  { id: 'vache',    nom: 'Margot',     base: 5.2, gout: { paille: 1.0,  boue: 0.95, gland: 1.0,  tracteur: 1.05, etoile: 1.0 },  couleur: '#9be7ff' },
  { id: 'lapin',    nom: 'Lapinou',    base: 6.2, gout: { paille: 0.8,  boue: 0.95, gland: 1.1,  tracteur: 1.15, etoile: 1.1 },  couleur: '#d98bff' },
  { id: 'coq',      nom: 'Cocorico',   base: 7.5, gout: { paille: 0.95, boue: 1.0,  gland: 1.0,  tracteur: 0.95, etoile: 1.0 },  couleur: '#ffd23f' },

function classe(id) { return CLASSES.find(c => c.id === id) || CLASSES[0]; }

function tempsParGrange(rival, coupeId, classeId) {

  for (const t of cp.tables) {

    recordsTables: {}, // table -> { temps, historique: [derniers temps] }

// La coupe Étoile demande un trophée dans les 4 premières.
function coupesDebloquees(sv) {
  const l = ['paille'];
  const aTrophee = id => CLASSES.some(cl => { const r = sv.records[cleRecord(id, cl.id)]; return r && trophee(r.place); });
  for (let i = 1; i < COUPES.length; i++) {

function enregistrer(sv, coupeId, classeId, temps) {
  const avant = coupesDebloquees(sv);
  const p = place(coupeId, classeId, temps);
  const k = cleRecord(coupeId, classeId);
  const ancien = sv.records[k];
  const record = !ancien || temps < ancien.temps;
  if (record) sv.records[k] = { temps, place: p };
  const apres = coupesDebloquees(sv);
  const nouvelles = apres.filter(x => !avant.includes(x));

function fini(sv) { return CLASSES.some(cl => meilleurTrophee(sv, 'etoile', cl.id) > 0); }

function coupesOr(sv) {
  let n = 0;
  for (const cp of COUPES) for (const cl of CLASSES) if (meilleurTrophee(sv, cp.id, cl.id) === 1) n++;

// ---------- Astuces (mode flash cards) ----------
const ASTUCES_TABLE = {

  5:  { titre: 'Fois 5 : la moitié de fois 10', lignes: ['Fais fois 10, puis prends la moitié.', '5 × 8 : 80, la moitié = 40', 'Ça finit toujours par 0 ou par 5.'] },
  6:  { titre: 'Fois 6 : fois 5, plus une fois', lignes: ['Fais fois 5, puis ajoute le nombre.', '6 × 7 = 35 + 7 = 42'] },
  7:  { titre: 'Fois 7 : fois 5, plus fois 2', lignes: ['Fais fois 5, puis ajoute le double.', '7 × 6 = 30 + 12 = 42', 'À retenir : 7 × 7 = 49 et 7 × 8 = 56.'] },
  8:  { titre: 'Fois 8 : double, double, double', lignes: ['Double trois fois de suite.', '8 × 6 : 6 → 12 → 24 → 48'] },
  9:  { titre: 'Fois 9 : fois 10, moins une fois', lignes: ['Fais fois 10, puis enlève le nombre.', '9 × 7 = 70 − 7 = 63', 'Vérifie : les chiffres font 9 (6 + 3).'] },
  10: { titre: 'Fois 10 : on ajoute un zéro', lignes: ['Le nombre, puis un zéro au bout.', '10 × 7 = 70'] },

const ORDRE_ASTUCES = [1, 10, 2, 5, 9, 4, 3, 6, 8, 7]; // de la plus facile à la plus longue
const MEMOS = {
  '7x8': '5, 6, 7, 8 : 56 = 7 × 8 !',
  '8x8': '64, comme les cases d\'un échiquier.',
  '7x7': '49, juste avant 50.',

  '6x7': '42 : la table de 6 et de 7 se croisent ici.',

// Découpe de la grille pour le dessin : groupes de rangées (de n cochons)
const DECOUPE = { 1: [1], 2: [1, 1], 3: [2, 1], 4: [2, 2], 5: [5], 6: [5, 1], 7: [5, 2], 8: [4, 4], 9: [10], 10: [10] };  // 9 : 10 rangées dont une qu'on enlève

// Explication pour une multiplication : on prend la table la plus facile des deux
function astuce(a, b) {

    case 1:  titre = 'Fois 1, rien ne change'; calcul = `${n} × 1 = ${n}`; break;
    case 10: titre = 'Fois 10 : on ajoute un zéro'; calcul = `${n} → ${r}`; break;
    case 2:  titre = 'Le double'; calcul = `${n} + ${n} = ${r}`; break;
    case 3:  titre = 'Le double, plus une fois'; calcul = `${2 * n} + ${n} = ${r}`; break;
    case 4:  titre = 'Le double du double'; calcul = `${n} → ${2 * n} → ${r}`; break;
    case 5:  titre = 'La moitié de fois 10'; calcul = `${n * 10}, la moitié = ${r}`; break;
    case 6:  titre = 'Fois 5, plus une fois'; calcul = `${5 * n} + ${n} = ${r}`; break;
    case 7:  titre = 'Fois 5, plus fois 2'; calcul = `${5 * n} + ${2 * n} = ${r}`; break;
    case 8:  titre = 'Double, double, double'; calcul = `${n} → ${2 * n} → ${4 * n} → ${r}`; break;
    case 9:  titre = 'Fois 10, moins une fois'; calcul = `${10 * n} − ${n} = ${r}`; break;

// Paquet de cartes : une table, ou les 10 multiplications les moins bien sues
function paquet(maitrise, table, rand) {
  rand = rand || Math.random;

    l = [];

  }
  for (let i = l.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [l[i], l[j]] = [l[j], l[i]]; }

<script>// Sons : bruitages synthétisés (Web Audio), musiques en boucle, voix enregistrées.
(function () {
'use strict';
const A = {
  ctx: null, master: null, sfxBus: null, musBus: null, voiceBus: null,
  buffers: {}, musique: null, musiqueNom: null,
  volMusique: 0.7, volBruitages: 1,
  pret: false,

A.init = function () {
  if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  const comp = A.ctx.createDynamicsCompressor();

  A.master.connect(comp); comp.connect(A.ctx.destination);
  A.sfxBus = A.ctx.createGain(); A.sfxBus.connect(A.master);
  A.musBus = A.ctx.createGain(); A.musBus.connect(A.master);
  A.voiceBus = A.ctx.createGain(); A.voiceBus.connect(A.master);
  A.appliquerVolumes();
  A.chargerTout();
};

A.appliquerVolumes = function () {
  if (!A.ctx) return;
  A.sfxBus.gain.value = 0.55 * A.volBruitages;
  A.voiceBus.gain.value = 1.1 * A.volBruitages;
  A.musBus.gain.setTargetAtTime(0.42 * A.volMusique * (A.duck || 1), A.ctx.currentTime, 0.08);

  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);

}

  try {
    let ab;

    else ab = await (await fetch(src)).arrayBuffer();
    A.buffers[nom] = await new Promise((ok, ko) => A.ctx.decodeAudioData(ab, ok, ko));
  } catch (e) { console.warn('son', nom, e); }
}
A.chargerTout = async function () {
  const as = window.ASSETS || {};

  for (const [k, v] of Object.entries(as.voix || {})) jobs.push(charger('v_' + k, v));
  for (const [k, v] of Object.entries(as.music || {})) jobs.push(charger('m_' + k, v));
  await Promise.all(jobs);

};

// ---------- Musique ----------
A.jouerMusique = function (nom, force) {

  const buf = A.buffers['m_' + nom];
  if (!buf) return;
  const t = A.ctx.currentTime;
  if (A.musique) {
    const old = A.musique;
    old.g.gain.setTargetAtTime(0, t, 0.25);
    setTimeout(() => { try { old.s.stop(); } catch (e) {} }, 1500);
  }

};
A.baisserMusique = function (f) { A.duck = f; A.appliquerVolumes(); };

// ---------- Voix ----------
let voixEnCours = null;
A.voix = function (nom) {
  if (!A.ctx || A.volBruitages <= 0) return;
  const buf = A.buffers['v_' + nom];
  if (!buf) return;
  if (voixEnCours) { try { voixEnCours.stop(); } catch (e) {} }
  const s = A.ctx.createBufferSource(); s.buffer = buf; s.connect(A.voiceBus); s.start();
  voixEnCours = s;
  A.baisserMusique(0.45);

function env(g, t, a, d, v) {
  g.gain.cancelScheduledValues(t);

let bruitBuf = null;
function bruit(t, dur, vol, freq, q, type) {

}
const GAMME = [0, 2, 4, 7, 9]; // pentatonique
function note(i, base) { const o = Math.floor(i / 5), n = GAMME[((i % 5) + 5) % 5]; return base * Math.pow(2, (o * 12 + n) / 12); }

A.sfx = function (nom, p) {
  if (!A.ctx || A.volBruitages <= 0) return;
  const t = A.ctx.currentTime;
  switch (nom) {
    case 'touche': osc('square', 660 + (p || 0) * 30, t, 0.06, 0.18); break;
    case 'efface': osc('square', 300, t, 0.08, 0.15, 180); break;
    case 'valide': osc('square', 520, t, 0.07, 0.2); osc('square', 780, t + 0.06, 0.1, 0.2); break;
    case 'plop': { // un cochon atterrit, la note monte avec le compte
      const f = note(Math.min(p || 0, 40), 262);
      osc('square', f, t, 0.07, 0.13);
      osc('triangle', f / 2, t, 0.09, 0.2, f / 4);
      break;
    }
    case 'chute': osc('sine', 1400, t, 0.12, 0.04, 500); break;
    case 'rangee': osc('triangle', note(p || 0, 523), t, 0.18, 0.18); break;
    case 'toit': bruit(t, 0.35, 0.6, 180, 0.8, 'lowpass'); osc('sine', 110, t, 0.35, 0.6, 45); break;
    case 'parfait':
      [0, 2, 4, 7, 9, 12].forEach((n, i) => osc('square', 523 * Math.pow(2, n / 12), t + i * 0.06, 0.16, 0.14));
      osc('triangle', 1046, t + 0.36, 0.5, 0.18);
      break;
    case 'faux':
      osc('sawtooth', 220, t, 0.18, 0.18, 150); osc('sawtooth', 160, t + 0.17, 0.3, 0.18, 90);
      break;
    case 'coeur': // le coeur se brise
      bruit(t, 0.25, 0.5, 3000, 0.7); osc('square', 880, t, 0.25, 0.12, 110);
      break;
    case 'ejecte': osc('square', 400, t, 0.15, 0.08, 1600); break;
    case 'bip': osc('square', 440, t, 0.18, 0.22); break;
    case 'go': osc('square', 880, t, 0.5, 0.22); osc('square', 1320, t, 0.5, 0.08); break;
    case 'whoosh': bruit(t, 0.3, 0.25, 900, 0.6); break;
    case 'trophee':
      [0, 4, 7, 12, 7, 12, 16].forEach((n, i) => osc('square', 392 * Math.pow(2, n / 12), t + i * 0.11, 0.2, 0.14));
      osc('triangle', 392 * 4, t + 0.8, 0.9, 0.16);
      break;
    case 'clic': osc('square', 900, t, 0.04, 0.12); break;
    case 'tic': osc('square', 1200, t, 0.02, 0.05); break;
    case 'depasse': osc('square', 700, t, 0.06, 0.1); osc('square', 1050, t + 0.05, 0.08, 0.1); break;
    case 'oh': osc('triangle', 330, t, 0.25, 0.2, 220); break;
  }
};

window.Son = A;
})();

// ---------- Couleurs ----------

// ---------- Grille élastique (fond) ----------
const Grille = { pas: 48, cols: 0, rows: 0, px: null, py: null, vx: null, vy: null, rx: null, ry: null, W: 0, H: 0 };
G.grille = Grille;
Grille.redim = function (W, H) {
  if (Math.abs(W - Grille.W) < 1 && Math.abs(H - Grille.H) < 1) return;
  Grille.W = W; Grille.H = H;
  Grille.cols = Math.ceil(W / Grille.pas) + 3; Grille.rows = Math.ceil(H / Grille.pas) + 3;
  const n = Grille.cols * Grille.rows;
  Grille.px = new Float32Array(n); Grille.py = new Float32Array(n); Grille.vx = new Float32Array(n); Grille.vy = new Float32Array(n);
  Grille.rx = new Float32Array(n); Grille.ry = new Float32Array(n);
  const ox = (W - (Grille.cols - 1) * Grille.pas) / 2, oy = (H - (Grille.rows - 1) * Grille.pas) / 2;
  for (let j = 0; j < Grille.rows; j++) for (let i = 0; i < Grille.cols; i++) {
    const k = j * Grille.cols + i;
    Grille.px[k] = Grille.rx[k] = ox + i * Grille.pas;
    Grille.py[k] = Grille.ry[k] = oy + j * Grille.pas;

};
// impulsion radiale (force > 0 : pousse ; < 0 : aspire)
Grille.choc = function (x, y, force, rayon) {
  if (!Grille.px) return;
  const r2 = rayon * rayon;
  for (let k = 0; k < Grille.px.length; k++) {
    const dx = Grille.px[k] - x, dy = Grille.py[k] - y, d2 = dx * dx + dy * dy;
    if (d2 > r2 || d2 < 1) continue;
    const d = Math.sqrt(d2), f = force * (1 - d / rayon);
    Grille.vx[k] += dx / d * f; Grille.vy[k] += dy / d * f;
  }
};
Grille.maj = function (dt) {
  if (!Grille.px) return;
  const C = Grille.cols, R = Grille.rows, k1 = 60, k2 = 30, amort = Math.exp(-4.5 * dt);
  for (let j = 0; j < R; j++) for (let i = 0; i < C; i++) {
    const k = j * C + i;
    let ax = (Grille.rx[k] - Grille.px[k]) * k1, ay = (Grille.ry[k] - Grille.py[k]) * k1;
    if (i > 0 && i < C - 1 && j > 0 && j < R - 1) {
      const mx = (Grille.px[k - 1] + Grille.px[k + 1] + Grille.px[k - C] + Grille.px[k + C]) / 4;
      const my = (Grille.py[k - 1] + Grille.py[k + 1] + Grille.py[k - C] + Grille.py[k + C]) / 4;
      ax += (mx - Grille.px[k] - (Grille.rx[k] - (Grille.rx[k - 1] + Grille.rx[k + 1]) / 2) * 0) * k2;
      ay += (my - Grille.py[k]) * k2;
    }
    Grille.vx[k] = (Grille.vx[k] + ax * dt) * amort;
    Grille.vy[k] = (Grille.vy[k] + ay * dt) * amort;

Grille.dessiner = function (ctx, couleur, t) {
  if (!Grille.px) return;
  const C = Grille.cols, R = Grille.rows;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = couleur || 'rgba(60,110,255,0.22)';
  ctx.beginPath();

    for (let i = 0; i < C; i++) { const k = j * C + i; if (i === 0) ctx.moveTo(Grille.px[k], Grille.py[k]); else ctx.lineTo(Grille.px[k], Grille.py[k]); }
  }
  for (let i = 0; i < C; i++) {
    for (let j = 0; j < R; j++) { const k = j * C + i; if (j === 0) ctx.moveTo(Grille.px[k], Grille.py[k]); else ctx.lineTo(Grille.px[k], Grille.py[k]); }
  }

  ctx.fillStyle = 'rgba(120,200,255,0.5)';

    const dx = Grille.px[k] - Grille.rx[k], dy = Grille.py[k] - Grille.ry[k];

// ---------- Particules (carrés de pixels) ----------
const parts = [];
G.particules = parts;
G.eclat = function (x, y, n, couleurs, vitesse, opts) {
  opts = opts || {};
  for (let i = 0; i < n; i++) {
    const a = opts.angle != null ? opts.angle + (Math.random() - 0.5) * (opts.cone || 1) : Math.random() * Math.PI * 2;
    const v = vitesse * (0.3 + Math.random() * 0.9);

      x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      vie: 0, duree: (opts.duree || 0.8) * (0.5 + Math.random()),

G.majParticules = function (dt) {

G.dessinerParticules = function (ctx) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

    const k = 1 - p.vie / p.duree;

    const s = p.taille * (0.4 + 0.6 * k);

      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-s / 2, -s / 4, s, s / 2); ctx.restore();
    } else ctx.fillRect(Math.round(p.x - s / 2), Math.round(p.y - s / 2), s, s);

};

// ---------- Textes qui sautent ----------
const pops = [];
G.pops = pops;
G.pop = function (texte, x, y, opts) {
  opts = opts || {};
  pops.push({ texte, x, y, vie: 0, bande: opts.bande || null, duree: opts.duree || 1.4, taille: opts.taille || 60, couleur: opts.couleur || G.C.jaune, monte: opts.monte != null ? opts.monte : 60, police: opts.police || 'titre', contour: opts.contour || '#1a0630' });
};
G.majPops = function (dt) { for (let i = pops.length - 1; i >= 0; i--) { pops[i].vie += dt; if (pops[i].vie > pops[i].duree) pops.splice(i, 1); } };
G.dessinerPops = function (ctx) {
  for (const p of pops) {
    const t = p.vie / p.duree;
    const e = t < 0.15 ? G.elastique(t / 0.15) : 1;
    const a = t > 0.75 ? 1 - (t - 0.75) / 0.25 : 1;
    ctx.save();
    ctx.globalAlpha = a;
    if (p.bande) {
      ctx.fillStyle = 'rgba(6,4,30,0.82)';
      const bh = p.taille * 2.1 * Math.min(1, t * 8);
      ctx.fillRect(p.bande.x, p.y - bh / 2, p.bande.w, bh);
      ctx.fillStyle = p.couleur; ctx.globalAlpha = a * 0.9;
      ctx.fillRect(p.bande.x, p.y - bh / 2, p.bande.w, 3); ctx.fillRect(p.bande.x, p.y + bh / 2 - 3, p.bande.w, 3);
      ctx.globalAlpha = a;
    }
    ctx.translate(p.x, p.y - p.monte * t);
    ctx.scale(e, e);
    G.texte(ctx, p.texte, 0, 0, p.taille, p.couleur, { police: p.police, contour: p.contour, lueur: p.couleur });
    ctx.restore();

};

// ---------- Texte ----------
G.police = function (type, taille) {
  return type === 'titre' ? `${taille}px PS2, "Courier New", monospace` : `700 ${taille}px PDC, "Trebuchet MS", sans-serif`;
};
// Textes figés (logos, titres) : rendus une fois dans une image, avec leur halo, puis simplement recopiés.
const cacheTextes = new Map();
G.texteFige = function (ctx, s, x, y, taille, couleur, o) {
  o = o || {};

  const cle = [s, taille, couleur, o.police, o.contour, o.lueur, o.epaisseur, echelle.toFixed(2)].join('|');
  let im = cacheTextes.get(cle);
  if (!im) {
    const m = document.createElement('canvas').getContext('2d');
    const larg = G.largeur(m, s, taille, o.police) + taille * 1.6;
    const haut = taille * 2.6;
    m.canvas.width = Math.ceil(larg * echelle); m.canvas.height = Math.ceil(haut * echelle);
    m.setTransform(echelle, 0, 0, echelle, 0, 0);
    G.texte(m, s, larg / 2, haut / 2, taille, couleur, Object.assign({}, o, { align: 'center' }));
    im = { c: m.canvas, larg, haut };
    if (cacheTextes.size > 300) cacheTextes.clear();
    cacheTextes.set(cle, im);

};
G.texte = function (ctx, s, x, y, taille, couleur, o) {
  o = o || {};
  let police = o.police || 'texte';
  // les chiffres de la police « texte » se confondent (5/S, 2/8) : on écrit les nombres en police titre
  if (police === 'texte' && /[0-9]/.test(s)) { police = 'titre'; taille *= 0.74; }
  // la police titre n'a pas les majuscules accentuées
  if (police === 'titre') s = s.replace(/[ÉÈÊË]/g, 'E').replace(/[ÀÂ]/g, 'A').replace(/[ÎÏ]/g, 'I').replace(/Ç/g, 'C').replace(/Ô/g, 'O').replace(/[ÙÛ]/g, 'U').replace(/Œ/g, 'OE');
  ctx.font = G.police(police, taille);

  ctx.textBaseline = o.base || 'middle';

    ctx.lineJoin = 'round';
    ctx.lineWidth = o.epaisseur || Math.max(3, taille * 0.16);
    ctx.strokeStyle = o.contour;
    ctx.strokeText(s, x, y + taille * 0.06);
    ctx.strokeText(s, x, y);
  }
  if (o.lueur) { ctx.shadowColor = o.lueur; ctx.shadowBlur = o.flou || taille * 0.35; }

};
G.largeur = function (ctx, s, taille, police) {
  police = police || 'texte';
  if (police === 'texte' && /[0-9]/.test(s)) { police = 'titre'; taille *= 0.74; }   // même règle que G.texte

// ---------- Formes néon ----------
G.rectNeon = function (ctx, x, y, w, h, couleur, opts) {
  opts = opts || {};

  if (opts.fond) { ctx.fillStyle = opts.fond; ctx.fillRect(x, y, w, h); }
  ctx.strokeStyle = couleur; ctx.lineWidth = opts.epaisseur || 3;
  const flou = opts.flou != null ? opts.flou : 14;

    ctx.globalAlpha *= 0.28; ctx.lineWidth = (opts.epaisseur || 3) * 3.2;
    ctx.strokeRect(x, y, w, h);

};

// ---------- Courbes ----------
G.elastique = function (t) { if (t <= 0) return 0; if (t >= 1) return 1; return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) + 1; };

G.rebond = function (t) {
  t = Math.min(1, Math.max(0, t));

};

window.Gfx = G;

// ---------- Boutons (immédiats) ----------
function bouton(id, x, y, w, h, o, action) {
  o = o || {};
  const actif = !o.desactive;
  boutons.push({ id, x, y, w, h, action: actif ? action : null });
  const enfonce = appui && appui.id === id && temps - appui.t < 0.15;
  const k = enfonce ? 0.93 : 1;
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2); ctx.scale(k, k);
  const coul = actif ? (o.couleur || C.cyan) : '#3a4180';
  const fond = o.fond || (actif ? 'rgba(10,16,60,0.85)' : 'rgba(10,12,40,0.6)');
  G.rectNeon(ctx, -w / 2, -h / 2, w, h, coul, { fond, flou: actif ? (o.flou != null ? o.flou : 16) : 0, epaisseur: o.epaisseur || 3, coin: Math.min(12, h / 4) });
  if (o.dessin) o.dessin(ctx, w, h, actif);
  if (o.texte != null) G.texte(ctx, o.texte, o.dx || 0, o.dy || 0, o.taille || h * 0.42, actif ? (o.couleurTexte || '#fff') : '#5b63a8', { police: o.police || 'texte', lueur: actif ? coul : null, flou: 8 });
  if (o.sous) G.texte(ctx, o.sous, 0, h * 0.28, o.tailleSous || h * 0.18, actif ? '#bcd' : '#5b63a8', {});
  ctx.restore();
}

// ---------- Fond commun ----------
const etoiles = [];
for (let i = 0; i < 90; i++) etoiles.push({ x: Math.random(), y: Math.random(), s: Math.random() < 0.15 ? 3 : 2, p: Math.random() * 6, c: Math.random() < 0.3 ? C.rosePale : '#cfe' });
// Le dégradé et les étoiles fixes sont dessinés une fois dans une image ; seules quelques étoiles scintillent.
let fondCache = null;
function fond(dt) {
  if (!fondCache || fondCache.width !== cv.width || fondCache.height !== cv.height) {
    fondCache = document.createElement('canvas'); fondCache.width = cv.width; fondCache.height = cv.height;
    const f = fondCache.getContext('2d'); f.setTransform(ECH, 0, 0, ECH, 0, 0);
    const g = f.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#05061a'); g.addColorStop(0.55, '#0b0f3a'); g.addColorStop(1, '#16114a');
    f.fillStyle = g; f.fillRect(0, 0, W, H);
    etoiles.forEach((e, i) => { if (i % 4) { f.globalAlpha = 0.5; f.fillStyle = e.c; f.fillRect(e.x * W, e.y * H, e.s, e.s); } });
  }
  ctx.drawImage(fondCache, 0, 0, W, H);
  for (let i = 0; i < etoiles.length; i += 4) {
    const e = etoiles[i];
    ctx.globalAlpha = 0.35 + 0.35 * Math.sin(temps * 2 + e.p);
    ctx.fillStyle = e.c; ctx.fillRect(e.x * W, e.y * H, e.s, e.s);
  }
  ctx.globalAlpha = 1;
  G.grille.dessiner(ctx, 'rgba(70,110,255,0.20)', temps);
}

// ---------- Pluie de cochons décorative (menus) ----------
const deco = [];
function decoMaj(dt, dense) {
  if (Math.random() < dt * (dense ? 4 : 1.6)) {
    const s = 26 + Math.random() * 30;
    deco.push({ x: Math.random() * W, y: -60, vy: 60 + Math.random() * 80, vx: (Math.random() - 0.5) * 40, r: Math.random() * 6, vr: (Math.random() - 0.5) * 3, s, rebonds: 0 });
  }
  for (let i = deco.length - 1; i >= 0; i--) {
    const d = deco[i];
    d.vy += 900 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.r += d.vr * dt;
    if (d.y > H - 30 && d.vy > 0 && d.rebonds < 1) { d.vy *= -0.45; d.vx *= 2; d.vr *= 2; d.rebonds++; G.grille.choc(d.x, H - 30, 90, 140); }
    if (d.y > H + 80) deco.splice(i, 1);
  }
}
function decoDessin() {
  for (const d of deco) {
    ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.r);
    G.dessiner(ctx, G.cochons.normal, -d.s / 2, -d.s / 2, d.s, d.s * 13 / 14, 0.85);

}

}

const ADRESSE = 'pikifou.github.io/pluie-de-cochons';
let aide = null;   // null | 'installer' | 'pleinecran'

function installer() {
  if (installEvt) {
    const ev = installEvt;
    try {
      ev.prompt();
      ev.userChoice.then(c => { if (c.outcome === 'accepted') installEvt = null; }).catch(() => {});
      return;

}

function pleinEcranActif() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function basculerPleinEcran() {
  const el = document.documentElement;
  if (pleinEcranActif()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req || DANS_CADRE && !document.fullscreenEnabled) { aide = 'pleinecran'; return; }
  try {
    const r = req.call(el, { navigationUI: 'hide' });
    if (r && r.catch) r.catch(() => { aide = 'pleinecran'; });
  } catch (e) { aide = 'pleinecran'; }
}
function iconePleinEcran(c, w, h) {
  const s2 = h * 0.26, e = 4, on = pleinEcranActif();
  c.strokeStyle = '#fff'; c.lineWidth = e;
  c.beginPath();
  for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
    const x = sx * s2, y = sy * s2, d = on ? -s2 * 0.6 : s2 * 0.6;
    c.moveTo(x, y - sy * d); c.lineTo(x, y); c.lineTo(x - sx * d, y);
  }
  c.stroke();
}
function boutonPleinEcran(x, y, t) {
