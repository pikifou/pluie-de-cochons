<head>

<meta name="mobile-web-app-capable" content="yes">

<title>Pluie de Cochons</title>
<!--PWA-->
<style>
@font-face { font-family: 'PS2'; src: url(/*FONT_PS2*/) format('woff2'); font-display: block; }
@font-face { font-family: 'PDC'; font-weight: 700; src: url(/*FONT_PDC*/) format('woff2'); font-display: block; }
:root { color-scheme: dark; }
html, body { margin: 0; height: 100%; background: #070a24; overflow: hidden; overscroll-behavior: none; }
body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
canvas { display: block; width: 100%; height: 100%; }
#nom-boite { position: fixed; inset: 0; background: rgba(4,6,24,0.85); display: flex; align-items: center; justify-content: center; z-index: 5; }
#nom-boite[hidden] { display: none; }
#nom-form { display: flex; flex-direction: column; gap: 16px; align-items: center; padding: 28px; border: 3px solid #ff5cae; box-shadow: 0 0 24px #ff5cae; background: #0d1240; }
#nom-form label { font: 700 26px PDC, sans-serif; color: #ffb6cb; }
#nom-champ { font: 700 30px PDC, sans-serif; width: 12ch; padding: 8px 12px; background: #070a24; color: #fff; border: 2px solid #4df3ff; outline: none; text-align: center; }
#nom-champ:focus { box-shadow: 0 0 14px #4df3ff; }
#nom-ok { font: 24px PS2, monospace; padding: 14px 28px; background: #070a24; color: #6dff8f; border: 3px solid #6dff8f; cursor: pointer; }
/* l'histoire : une intro, une fin (vidéo si elle est là, puis l'image et le texte) */
#cine { --cine-fond: #070a24; --cine-texte: #fff4fa; --cine-titre: #ffe14d; --cine-bouton: #6dff8f; --cine-rose: #ff5cae;
  position: fixed; inset: 0; z-index: 6; background: var(--cine-fond); display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
#cine[hidden] { display: none; }
#cine .cadre { position: relative; height: 100%; max-width: 100%; aspect-ratio: 9 / 16; overflow: hidden; }
#cine video, #cine img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#cine img { opacity: 0; transition: opacity .6s; } #cine.texte img { opacity: 1; }
#cine .txt { position: absolute; left: 0; right: 0; bottom: 0; padding: 56px 7% max(6%, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
  background: linear-gradient(rgba(7,10,36,0), rgba(7,10,36,.82) 38%, rgba(7,10,36,.94)); opacity: 0; transform: translateY(20px); transition: opacity .6s .3s, transform .6s .3s; pointer-events: none; }
#cine.texte .txt { opacity: 1; transform: none; pointer-events: auto; }
/* l'intro : le texte en haut, sur le ciel (le héros est en bas de l'image) */
#cine.haut .txt { bottom: auto; top: 0; padding: max(6%, env(safe-area-inset-top)) 7% 70px; transform: translateY(-20px); background: linear-gradient(rgba(7,10,36,.94), rgba(7,10,36,.82) 62%, rgba(7,10,36,0)); }
#cine.haut.texte .txt { transform: none; }
#cine h2 { position: absolute; top: max(5%, env(safe-area-inset-top)); left: 0; right: 0; margin: 0; text-align: center; opacity: 0; transition: opacity .8s;
  font: clamp(30px, 6.5vh, 56px) PS2, monospace; color: var(--cine-titre); text-shadow: 0 4px 0 #1a0630, 0 0 18px rgba(255,225,77,.55); }
#cine.texte h2 { opacity: 1; } #cine h2[hidden] { display: none; }
#cine p { margin: 0; font: 700 clamp(17px, 2.6vh, 26px)/1.2 PDC, sans-serif; color: var(--cine-texte); text-shadow: 0 3px 0 #1a0630; }
#cine p.l1 { color: #ffb6cb; font-size: clamp(20px, 3.2vh, 30px); }
#cine button { font: clamp(16px, 2.6vh, 22px) PS2, monospace; cursor: pointer; white-space: nowrap; }
#cine .go { color: var(--cine-bouton); background: rgba(7,10,36,.9); border: 3px solid var(--cine-bouton); box-shadow: 0 0 18px var(--cine-bouton); padding: 14px 26px; margin-top: 6px; }
#cine .passer { position: absolute; top: max(14px, env(safe-area-inset-top)); right: 14px; font-size: 14px; padding: 9px 12px; color: #fff; background: rgba(7,10,36,.7); border: 2px solid var(--cine-rose); }
#cine.texte .passer { display: none; }
</style>
</head>
<body>
<canvas id="jeu"></canvas>
<div id="nom-boite" hidden><form id="nom-form" autocomplete="off"><label for="nom-champ">Comment tu t'appelles ?</label><input id="nom-champ" maxlength="14" enterkeyhint="done"><button id="nom-ok" type="submit">OK</button></form></div>
<div id="cine" hidden><div class="cadre"><video playsinline muted preload="auto"></video><img alt=""><h2></h2><div class="txt"><p class="l1"></p><p class="l2"></p><button type="button" class="go"></button></div><button type="button" class="passer"></button></div></div>
